version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocp
      POSTGRES_PASSWORD: ocp_dev_password
      POSTGRES_DB: ocp
    ports:
      - "5432:5432"
    volumes:
      - ocp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocp"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocp-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OCP_DATABASE_URL: postgresql://ocp:ocp_dev_password@postgres:5432/ocp
      OCP_PORT: 8080
      OCP_HOST: 0.0.0.0
      # API keys — override via .env file or environment in production.
      # Format:  OCP_API_KEYS=key1,key2
      # Per-key workspace scoping (optional):
      #   OCP_API_KEY_WORKSPACES=key1:ws_id1,ws_id2;key2:ws_id3
      # Leave OCP_API_KEYS unset only for local development (open mode).
      OCP_API_KEYS: ${OCP_API_KEYS:-}
      OCP_API_KEY_WORKSPACES: ${OCP_API_KEY_WORKSPACES:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

volumes:
  ocp_pgdata:
