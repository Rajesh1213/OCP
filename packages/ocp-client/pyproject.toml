[project]
name = "ocp-client"
version = "0.1.0"
description = "Open Context Protocol — Python client SDK"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocp_client"]
