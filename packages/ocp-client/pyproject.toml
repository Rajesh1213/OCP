[project]
name = "ocp-client"
version = "0.2.0"
description = "Open Context Protocol — Python client SDK"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://www.opencontextprotocol.ai"
Repository = "https://github.com/Rajesh1213/OCP"
Documentation = "https://www.opencontextprotocol.ai/docs"
"Bug Tracker" = "https://github.com/Rajesh1213/OCP/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocp_client"]
