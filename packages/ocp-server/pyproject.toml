[project]
name = "ocp-server"
version = "0.1.0"
description = "Open Context Protocol — reference server implementation"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/Rajesh1213/OCP"
Repository = "https://github.com/Rajesh1213/OCP"
Documentation = "https://github.com/Rajesh1213/OCP/blob/main/docs/integrations.md"
"Bug Tracker" = "https://github.com/Rajesh1213/OCP/issues"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "aiofiles>=23.2",
    "watchfiles>=0.22",
    "uvicorn[standard]>=0.29",
    "starlette>=0.37",
    # Postgres backend (optional — only needed when OCP_DATABASE_URL is set)
    "asyncpg>=0.29; extra == 'postgres'",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]

[project.scripts]
ocp-server      = "ocp_server.server:main"
ocp-server-http = "ocp_server.server_http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocp_server"]
