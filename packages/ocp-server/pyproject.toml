[project]
name = "ocp-server"
version = "0.1.0"
description = "Open Context Protocol — reference server implementation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "aiofiles>=23.2",
    "watchfiles>=0.22",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
ocp-server = "ocp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocp_server"]
