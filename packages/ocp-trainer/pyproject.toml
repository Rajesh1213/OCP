[project]
name = "ocp-trainer"
version = "0.3.0"
description = "OCP Trainer — export fine-tuning datasets and train local prompt optimiser models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
unsloth = ["unsloth>=2024.1", "torch>=2.1"]
openai  = ["openai>=1.0"]
dev     = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ocp-trainer = "ocp_trainer.cli:main"

[project.urls]
Homepage      = "https://www.opencontextprotocol.ai"
Repository    = "https://github.com/Rajesh1213/OCP"
Documentation = "https://www.opencontextprotocol.ai/docs"
"Bug Tracker" = "https://github.com/Rajesh1213/OCP/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocp_trainer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.uv.sources]
ocp-server = { workspace = true }
