name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --no-dev

      - name: Install dev dependencies
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check packages/

      - name: Type-check
        run: uv run mypy packages/ocp-server/ocp_server packages/ocp-client/ocp_client --ignore-missing-imports

      - name: Conformance tests
        run: uv run pytest packages/ocp-conformance/ -v --tb=short
