name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── PyPI: ocp-server ────────────────────────────────────────────────────
  pypi-server:
    name: Publish ocp-server to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC token scoped to ocp-server pending publisher
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build ocp-server
        run: uv build --package ocp-server --out-dir dist/

      - name: Publish ocp-server
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── PyPI: ocp-client ────────────────────────────────────────────────────
  pypi-client:
    name: Publish ocp-client to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC token scoped to ocp-client pending publisher
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build ocp-client
        run: uv build --package ocp-client --out-dir dist/

      - name: Publish ocp-client
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── Docker ──────────────────────────────────────────────────────────────
  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write        # ghcr.io push
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
